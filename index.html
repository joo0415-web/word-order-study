<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>본문 배열 학습</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#f4f5fb;color:#1f2233;font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
.wrap{max-width:600px;margin:0 auto;padding:16px 16px 40px}
.wide{max-width:900px}
h1{font-size:20px;margin:6px 0 14px}
h2{font-size:16px;margin:22px 0 8px}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 1px 3px rgba(20,20,60,.08);margin-bottom:12px}
.in{width:100%;border:1px solid #d5d8ea;border-radius:10px;padding:10px;font:inherit;font-size:15px;background:#fff;resize:vertical}
.btn{border:0;border-radius:12px;padding:12px 18px;font-size:16px;font-weight:700;background:#4f46e5;color:#fff}
.btn.sub{background:#e8e9f8;color:#3730a3}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.4}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.warn{color:#c2410c;font-size:14px;margin:6px 0;min-height:1em}
.muted{color:#6b7090;font-size:13px}
.pair{display:grid;grid-template-columns:28px 1fr 1fr 40px;gap:8px;align-items:start;margin-bottom:10px}
.pair .no{font-weight:700;color:#6b7090;padding-top:8px}
.pair textarea{min-height:64px}
.pair .tl{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px}.pair .mg{background:none;border:0;color:#4f46e5;font-size:12px;padding:0}
.empty{border-color:#f59e0b!important;background:#fffbeb}.pair.chg textarea{border-color:#60a5fa;background:#eff6ff}
.link{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.link b{min-width:70px}
.link input{flex:1;min-width:0;font-size:12px}
@media(max-width:640px){.pair{grid-template-columns:1fr}.pair .no{padding:0}}

/* student */
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.top .t{font-weight:700;font-size:15px;color:#3730a3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .p{font-size:14px;color:#6b7090;white-space:nowrap}
.bar{height:6px;background:#dfe1f5;border-radius:3px;margin:8px 0 14px;overflow:hidden}
.bar i{display:block;height:100%;background:#4f46e5;transition:width .25s}
.ko{font-size:20px;line-height:1.6;font-weight:600}
.ans{min-height:92px;border:2px dashed #b9bdf0;border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;background:#fff;margin-bottom:10px}
.ans .ph{color:#9aa0c8;font-size:15px;padding:6px}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 16px}
.chip{border:1px solid #c7caf5;background:#fff;color:#1f2233;font-size:18px;padding:10px 14px;border-radius:12px;min-height:46px}
.chip:active{transform:scale(.96)}
.pool .chip.used{opacity:.18;pointer-events:none}
.ans .chip{background:#eef0ff;border-color:#a5a9ee}
.ans .chip.bad{background:#fee2e2;border-color:#ef4444;color:#b91c1c}
.ans .chip.ok{background:#dcfce7;border-color:#22c55e;color:#166534;pointer-events:none}
.banner{padding:12px 14px;border-radius:12px;font-size:16px;margin-bottom:10px;font-weight:600}
.banner.ok{background:#dcfce7;color:#166534}
.banner.no{background:#fee2e2;color:#991b1b}
.actions{display:flex;gap:8px}
.actions .btn{flex:1}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.big{font-size:44px;text-align:center;margin:10px 0}
.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eceefa;font-size:16px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#1f2233;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:9}
</style>
</head>

<div id="app"></div>

<script>
(function(){
'use strict';
var $ = function(s,r){return (r||document).querySelector(s)};
function h(tag, props){
  var e=document.createElement(tag), kids=Array.prototype.slice.call(arguments,2);
  Object.keys(props||{}).forEach(function(k){
    var v=props[k];
    if(k==='class') e.className=v;
    else if(k.indexOf('on')===0) e.addEventListener(k.slice(2),v);
    else if(k==='value') e.value=v;
    else if(v===true) e.setAttribute(k,'');
    else if(v!==false && v!=null) e.setAttribute(k,v);
  });
  [].concat.apply([],kids).forEach(function(c){ if(c!=null&&c!==false) e.append(c.nodeType?c:document.createTextNode(c)); });
  return e;
}
function toast(msg){var t=h('div',{class:'toast'},msg);document.body.append(t);setTimeout(function(){t.remove()},1800)}
function copyText(text){
  if(navigator.clipboard&&window.isSecureContext){return navigator.clipboard.writeText(text).then(function(){toast('복사됨')},fb)}
  fb();
  function fb(){var ta=h('textarea',{});ta.value=text;document.body.append(ta);ta.select();try{document.execCommand('copy');toast('복사됨')}catch(e){toast('복사 실패 - 직접 선택해서 복사하세요')}ta.remove()}
}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

/* ---------- 링크 인코딩 ---------- */
function encode(title,name,rows){
  var json=JSON.stringify([1,title,name,rows.map(function(r){return [r.en,r.ko]})]);
  return LZString.compressToBase64(json).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function decode(hash){
  try{
    var s=decodeURIComponent(hash).replace(/-/g,'+').replace(/_/g,'/').replace(/ /g,'+');
    while(s.length%4) s+='=';
    var d=JSON.parse(LZString.decompressFromBase64(s));
    if(d&&d[0]===1&&Array.isArray(d[3])&&d[3].length) return d;
  }catch(e){}
  return null;
}

/* ---------- 문장 분리 ---------- */
function splitSentences(text){
  var t=String(text||'').replace(/\r/g,'').replace(/Translated with DeepL\.com[^\n]*/gi,'').replace(/[ \t \n]+/g,' ').trim();
  if(!t) return [];
  t=t.replace(/\.(?=[^\s"'”’)\]])/g,'\u0001');
  t=t.replace(/\b(Mr|Mrs|Ms|Dr|Prof|St|Jr|Sr|vs)\./g,'$1\u0001')
     .replace(/\b([ei])\.([ge])\./gi,'$1\u0001$2\u0001')
     .replace(/\b([A-Z])\.(?=[A-Z]\.)/g,'$1\u0001')
     .replace(/\.( +)(?=[a-z])/g,'\u0001$1')
     .replace(/(\d)\.(\d)/g,'$1\u0001$2');
  var parts=t.match(/[^.?!]+(?:[.?!]+["'”’)\]]*|$)/g)||[t];
  return parts.map(function(s){return s.replace(/\u0001/g,'.').trim()}).filter(Boolean);
}


/* ---------- 길이 기반 자동 정렬 (Gale-Church 방식) ---------- */
function normCdf(z){
  var x=Math.abs(z), k=1/(1+0.2316419*x), d=0.3989423*Math.exp(-x*x/2);
  var p=d*k*(0.3193815+k*(-0.3565638+k*(1.781478+k*(-1.821256+k*1.330274))));
  return z>0?1-p:p;
}
function alignSentences(en,ko){
  var len=function(s){return s.replace(/\s/g,'').length||1};
  var el=en.map(len), kl=ko.map(len);
  var sum=function(a){return a.reduce(function(x,y){return x+y},0)};
  var c=sum(kl)/sum(el), S2=12;
  var beads=[[1,1,0.12],[1,2,2.4],[2,1,2.4],[1,0,4.6],[0,1,4.6],[2,2,4.5],[1,3,6],[3,1,6]];
  var n=en.length, m=ko.length, INF=1e9, i, j, b;
  var D=[],B=[];
  for(i=0;i<=n;i++){D.push([]);B.push([]);for(j=0;j<=m;j++){D[i].push(INF);B[i].push(null)}}
  D[0][0]=0;
  for(i=0;i<=n;i++)for(j=0;j<=m;j++){
    if(D[i][j]>=INF) continue;
    for(b=0;b<beads.length;b++){
      var a=beads[b][0], k=beads[b][1], ni=i+a, nj=j+k;
      if(ni>n||nj>m) continue;
      var e=0,kk=0,q;
      for(q=i;q<ni;q++) e+=el[q];
      for(q=j;q<nj;q++) kk+=kl[q];
      var cost=beads[b][2];
      if(a&&k){
        var delta=(kk-e*c)/Math.sqrt(Math.max(e,1)*S2);
        cost+=-Math.log(Math.max(2*(1-normCdf(Math.abs(delta))),1e-9));
      }
      if(D[i][j]+cost<D[ni][nj]){D[ni][nj]=D[i][j]+cost;B[ni][nj]=[i,j,a,k]}
    }
  }
  var out=[]; i=n; j=m;
  while(i>0||j>0){
    var bk=B[i][j]; if(!bk) break;
    out.unshift({en:en.slice(bk[0],i).join(' '),ko:ko.slice(bk[1],j).join(' '),chg:!(bk[2]===1&&bk[3]===1)});
    i=bk[0]; j=bk[1];
  }
  return out;
}

/* ================= 교사용 ================= */
function Teacher(){
  var root=$('#app'); root.innerHTML='';
  var rows=[];
  var saved=''; try{saved=localStorage.getItem('wb_base')||''}catch(e){}
  var defBase=/^https?:/.test(location.protocol)?location.origin+location.pathname:saved;
  var title=h('input',{class:'in',placeholder:'예) OO고 2학년 · Lesson 3'});
  var enTa=h('textarea',{class:'in',rows:7,placeholder:'영어 본문 붙여넣기'});
  var koTa=h('textarea',{class:'in',rows:7,placeholder:'한글 해석 붙여넣기 (한 줄에 한 문장이면 가장 정확)'});
  var msg=h('div',{class:'warn'});
  var rowsBox=h('div',{});
  var names=h('textarea',{class:'in',rows:3,placeholder:'학생 이름 (한 줄에 한 명, 비워두면 공용 링크 1개)'});
  var base=h('input',{class:'in',value:defBase,placeholder:'https://내사이트.netlify.app/',onchange:function(){try{localStorage.setItem('wb_base',base.value.trim())}catch(e){}}});
  var out=h('div',{});

  function split(){
    try{
      var en=splitSentences(enTa.value), koLines=koTa.value.replace(/Translated with DeepL\.com[^\n]*/gi,'').split(/\n+/).map(function(s){return s.trim()}).filter(Boolean);
      var ko=(koLines.length===en.length)?koLines:splitSentences(koTa.value);
      if(!en.length||!ko.length){msg.textContent='⚠ 영어 본문과 한글 해석을 모두 붙여넣으세요.';return}
      var note='';
      if(en.length===ko.length){
        rows=en.map(function(s,i){return {en:s,ko:ko[i],chg:false}});
      }else{
        rows=alignSentences(en,ko);
        var nc=rows.filter(function(r){return r.chg}).length;
        note='영어 '+en.length+'문장 / 한글 '+ko.length+'문장 → 길이 기준으로 자동 정렬했어요. 파란 칸 '+nc+'곳(합쳐지거나 어긋난 곳)을 확인하세요. ';
      }
      renderRows(); updateMsg(note);
    }catch(err){
      msg.textContent='⚠ 오류: '+(err&&err.message?err.message:err)+' (이 메시지를 캡처해서 알려주세요)';
    }
  }
  function trimRows(){rows.forEach(function(r){r.chg=false});while(rows.length&&!rows[rows.length-1].en&&!rows[rows.length-1].ko) rows.pop()}
  function mergeNext(col,i){
    if(i>=rows.length-1) return;
    rows[i][col]=(rows[i][col]+' '+rows[i+1][col]).trim();
    for(var j=i+1;j<rows.length-1;j++) rows[j][col]=rows[j+1][col];
    rows[rows.length-1][col]='';
    trimRows(); renderRows(); updateMsg();
  }
  function delCell(col,i){
    for(var j=i;j<rows.length-1;j++) rows[j][col]=rows[j+1][col];
    rows[rows.length-1][col]='';
    trimRows(); renderRows(); updateMsg();
  }
  function insCell(col,i){
    rows.push({en:'',ko:''});
    for(var j=rows.length-1;j>i;j--) rows[j][col]=rows[j-1][col];
    rows[i][col]='';
    trimRows(); renderRows(); updateMsg();
  }
  function updateMsg(note){
    var ne=rows.filter(function(r){return r.en.trim()}).length, nk=rows.filter(function(r){return r.ko.trim()}).length;
    var bad=rows.filter(function(r){return !r.en.trim()||!r.ko.trim()}).length;
    msg.textContent=(note||'')+(bad?'⚠ 비어 있는 칸(노란색)이 '+bad+'곳 있어요.':'✔ 영어 '+ne+'문장 = 한글 '+nk+'문장');
    msg.style.color=bad?'':'#15803d';
  }
  function tools(col,i){
    return h('div',{class:'tl'},
      i<rows.length-1?h('button',{class:'mg',onclick:function(){mergeNext(col,i)}},'↓합치기'):null,
      h('button',{class:'mg',onclick:function(){delCell(col,i)}},'✕이 칸 지우고 위로 당기기'),
      h('button',{class:'mg',onclick:function(){insCell(col,i)}},'＋빈 칸 넣고 아래로 밀기'));
  }
  function renderRows(){
    rowsBox.innerHTML='';
    rows.forEach(function(r,i){
      var e=h('textarea',{class:'in'+(r.en?'':' empty'),value:r.en,oninput:function(){r.en=e.value}});
      var k=h('textarea',{class:'in'+(r.ko?'':' empty'),value:r.ko,oninput:function(){r.ko=k.value}});
      rowsBox.append(h('div',{class:'pair'+(r.chg?' chg':'')},
        h('div',{class:'no'},String(i+1)),
        h('div',{},e,tools('en',i)),
        h('div',{},k,tools('ko',i)),
        h('button',{class:'btn sub sm',title:'삭제',onclick:function(){rows.splice(i,1);renderRows();updateMsg()}},'삭제')
      ));
    });
  }
  function generate(){
    var clean=rows.map(function(r){return {en:r.en.trim().replace(/\s+/g,' '),ko:r.ko.trim().replace(/\s+/g,' ')}}).filter(function(r){return r.en||r.ko});
    if(!clean.length) return alert('문장이 없어요. 먼저 [문장 나누기]를 누르세요.');
    if(clean.some(function(r){return !r.en||!r.ko})) return alert('영어/한글이 비어 있는 문장이 있어요.');
    var b=base.value.trim().replace(/#.*$/,'');
    if(!/^https?:\/\//.test(b)) return alert('앱 주소(https://...)를 입력하세요. 이 파일을 무료 호스팅에 올린 뒤의 주소입니다.');
    try{localStorage.setItem('wb_base',b)}catch(e){}
    var list=names.value.split('\n').map(function(s){return s.trim()}).filter(Boolean);
    if(!list.length) list=[''];
    out.innerHTML='';
    var all=[];
    list.forEach(function(n){
      var url=b+'#'+encode(title.value.trim(),n,clean);
      all.push((n?n+'\n':'')+url);
      var inp=h('input',{class:'in',readonly:true,value:url,onfocus:function(){inp.select()}});
      out.append(h('div',{class:'link'},h('b',{},n||'공용'),inp,
        h('button',{class:'btn sub sm',onclick:function(){copyText(url)}},'복사'),
        h('a',{href:url,target:'_blank',rel:'noopener',class:'btn sm',style:'text-decoration:none'},'열기')));
    });
    var len=(b+'#'+encode(title.value.trim(),list[0],clean)).length;
    out.append(h('div',{class:'row'},
      list.length>1?h('button',{class:'btn',onclick:function(){copyText(all.join('\n\n'))}},'이름+링크 전체 복사'):null,
      h('span',{class:'muted'},'링크 길이 약 '+len+'자 · 문장 '+clean.length+'개')));
  }

  root.append(h('div',{class:'wrap wide'},
    h('h1',{},'📖 본문 배열 학습 · 링크 만들기'),
    h('div',{class:'card'},
      h('h2',{style:'margin-top:0'},'① 제목 (선택)'),title,
      h('h2',{},'② 본문 · 해석 붙여넣기'),
      h('div',{class:'muted'},'영어 본문'),enTa,
      h('div',{class:'muted',style:'margin-top:8px'},'한글 해석'),koTa,
      h('div',{class:'row',style:'margin-top:10px'},h('button',{class:'btn',onclick:split},'문장 나누기 ▶')),
      msg),
    h('div',{class:'card'},h('h2',{style:'margin-top:0'},'③ 문장별 확인 · 수정'),
      h('div',{class:'muted'},'왼쪽 영어 한 문장 = 오른쪽 한글 한 문장이 되도록 맞춰주세요. 학생은 한글을 보고 영어 단어를 순서대로 누릅니다.'),
      h('div',{style:'height:8px'}),rowsBox),
    h('div',{class:'card'},h('h2',{style:'margin-top:0'},'④ 링크 만들기'),
      h('div',{class:'muted'},'앱 주소 (이 파일을 올린 무료 호스팅 주소)'),base,
      h('div',{class:'muted',style:'margin-top:8px'},'학생 이름 (선택 · 결과 공유 때 이름이 표시됨)'),names,
      h('div',{class:'row',style:'margin-top:10px'},h('button',{class:'btn',onclick:generate},'링크 생성')),
      h('div',{style:'height:10px'}),out)
  ));
}

/* ================= 학생용 ================= */
function Student(data){
  var title=data[1]||'본문 배열', name=data[2]||'', pairs=data[3];
  var N=pairs.length, miss=[], i0;
  for(i0=0;i0<N;i0++) miss.push(0);
  var round=1, queue=[], qi=0, t0=Date.now(), result=null, S=null;
  for(i0=0;i0<N;i0++) queue.push(i0);
  var root=$('#app');

  function load(){
    var i=queue[qi], toks=pairs[i][0].split(/\s+/);
    var items=toks.map(function(w,k){return {id:k,w:w}});
    var sh,tries=0;
    do{sh=shuffle(items);tries++}while(toks.length>1&&tries<30&&sh.every(function(o,k){return o.w===toks[k]}));
    S={i:i,toks:toks,pool:sh,placed:[],status:'idle',bad:[]};
  }
  function place(id){
    if(S.status==='correct'||S.placed.indexOf(id)>-1) return;
    S.placed.push(id);
    if(S.placed.length===S.toks.length){
      S.bad=[];
      S.placed.forEach(function(pid,p){if(S.toks[pid]!==S.toks[p]) S.bad.push(p)});
      if(S.bad.length){S.status='wrong'; if(round===1) miss[S.i]++; if(navigator.vibrate) navigator.vibrate(120);}
      else S.status='correct';
    }
    view(S.status==='wrong');
  }
  function removeAt(p){
    if(S.status==='correct') return;
    S.placed.splice(p,1); S.status='idle'; S.bad=[]; view();
  }
  function next(){
    qi++;
    if(qi>=queue.length){finish();return}
    load(); view(false,true);
  }
  function finish(){
    if(round===1){
      var tm=0,perfect=0,wrongIdx=[];
      miss.forEach(function(m,i){tm+=m;if(m===0)perfect++;else wrongIdx.push(i+1)});
      result={perfect:perfect,total:tm,sec:Math.round((Date.now()-t0)/1000),wrongIdx:wrongIdx};
    }
    summary();
  }
  function retry(){
    var q=[];miss.forEach(function(m,i){if(m>0)q.push(i)});
    if(!q.length) return;
    round=2;queue=q;qi=0;load();view(false,true);
  }
  function restart(){
    miss=miss.map(function(){return 0});round=1;queue=[];for(var i=0;i<N;i++)queue.push(i);qi=0;t0=Date.now();result=null;load();view(false,true);
  }
  function speak(t){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;speechSynthesis.speak(u)}catch(e){}}

  function view(shake,top){
    root.innerHTML='';
    var en=pairs[S.i][0], ko=pairs[S.i][1];
    var pct=Math.round(qi/queue.length*100);
    var ans=h('div',{class:'ans'+(shake?' shake':'')});
    if(!S.placed.length) ans.append(h('span',{class:'ph'},'아래 단어를 순서대로 눌러요'));
    S.placed.forEach(function(id,p){
      var cls='chip'+(S.status==='wrong'&&S.bad.indexOf(p)>-1?' bad':'')+(S.status==='correct'?' ok':'');
      ans.append(h('button',{class:cls,onclick:function(){removeAt(p)}},S.toks[id]));
    });
    var pool=h('div',{class:'pool'});
    S.pool.forEach(function(o){
      pool.append(h('button',{class:'chip'+(S.placed.indexOf(o.id)>-1?' used':''),onclick:function(){place(o.id)}},o.w));
    });
    var isLast=qi>=queue.length-1;
    var banner=null, actions;
    if(S.status==='correct'){
      banner=h('div',{class:'banner ok'},'✅ 정답!');
      actions=h('div',{class:'actions'},
        h('button',{class:'btn sub',onclick:function(){speak(en)}},'🔊 듣기'),
        h('button',{class:'btn',onclick:next},isLast?'결과 보기':'다음 ▶'));
    }else{
      if(S.status==='wrong') banner=h('div',{class:'banner no'},'❌ 빨간 단어가 틀렸어요. 눌러서 빼고 다시 놓아보세요.');
      actions=h('div',{class:'actions'},
        h('button',{class:'btn sub',disabled:!S.placed.length,onclick:function(){removeAt(S.placed.length-1)}},'↩ 되돌리기'),
        h('button',{class:'btn sub',disabled:!S.placed.length,onclick:function(){S.placed=[];S.status='idle';S.bad=[];view()}},'처음부터'));
    }
    root.append(h('div',{class:'wrap'},
      h('div',{class:'top'},h('div',{class:'t'},title+(round===2?' · 복습':'')),h('div',{class:'p'},(qi+1)+' / '+queue.length)),
      h('div',{class:'bar'},h('i',{style:'width:'+pct+'%'})),
      h('div',{class:'card ko'},ko),
      ans,banner,pool,actions));
    if(top) window.scrollTo(0,0);
  }

  function summary(){
    root.innerHTML='';
    var mm=Math.floor(result.sec/60), ss=result.sec%60;
    var text='['+title+'] '+(name?name+' ':'')+'본문 배열 완료\n첫 시도 정답 '+result.perfect+'/'+N+'\n오답 '+result.total+'회 · '+mm+'분 '+ss+'초'+(result.wrongIdx.length?'\n틀린 문장: '+result.wrongIdx.join(', ')+'번':'');
    root.append(h('div',{class:'wrap'},
      h('div',{class:'big'},result.perfect===N?'🎉':'👏'),
      h('h1',{style:'text-align:center'},(name?name+', ':'')+'끝났어요!'),
      h('div',{class:'card'},
        h('div',{class:'stat'},h('span',{},'첫 시도 정답'),h('b',{},result.perfect+' / '+N)),
        h('div',{class:'stat'},h('span',{},'오답 횟수'),h('b',{},result.total+'회')),
        h('div',{class:'stat'},h('span',{},'걸린 시간'),h('b',{},mm+'분 '+ss+'초')),
        result.wrongIdx.length?h('div',{class:'stat'},h('span',{},'틀린 문장'),h('b',{},result.wrongIdx.join(', ')+'번')):null),
      h('div',{class:'actions',style:'flex-direction:column'},
        result.wrongIdx.length?h('button',{class:'btn',onclick:retry},'틀린 문장만 다시 풀기'):null,
        h('button',{class:'btn sub',onclick:function(){
          if(navigator.share){navigator.share({text:text}).catch(function(){})}else{copyText(text)}
        }},'선생님께 결과 보내기'),
        h('button',{class:'btn sub',onclick:restart},'처음부터 다시'))
    ));
  }

  load(); view();
}

var raw=location.hash.replace(/^#/,'');
if(raw){
  var d=decode(raw);
  if(d) Student(d);
  else $('#app').append(h('div',{class:'wrap'},h('div',{class:'card'},'링크가 올바르지 않아요. 선생님께 새 링크를 받아주세요.')));
}else Teacher();
})();
</script>
